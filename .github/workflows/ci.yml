name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: CLI build (no GTK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

  full:
    name: Full build (GTK, via Nix)
    # Ubuntu's libadwaita is older than the 1.6 the GUI needs, so this job
    # builds in the flake's CI shell, which also provides Xvfb.
    runs-on: ubuntu-24.04
    env:
      CLEANER_REQUIRE_GUI_TESTS: "1"
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - run: nix develop .#ci -c xvfb-run -a cargo test --locked
      - run: nix develop .#ci -c cargo clippy --locked --all-targets -- -D warnings
